# ─── Cấu hình Máy chủ ───
server.port=8080

# ─── Cấu hình Cơ sở dữ liệu MySQL ───
# Tự động tạo database 'crms_db' nếu chưa tồn tại
spring.datasource.url=jdbc:mysql://localhost:3306/crms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# LƯU Ý: Vui lòng thay đổi username và password bên dưới nếu MySQL của bạn cấu hình khác
spring.datasource.username=root
spring.datasource.password=270606
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── Cấu hình Hibernate / JPA ───
# Tự động cập nhật cấu trúc bảng từ Entity Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Cho phép phục vụ file tĩnh và không bị đè bởi API
spring.mvc.static-path-pattern=/**
